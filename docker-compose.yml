version: '3.8'

services:
  # Backend Laravel Application
  app:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: evaluaciones-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./evaluaciones-backend:/var/www/html
    environment:
      - APP_NAME=EvaluacionesSISA
      - APP_ENV=local
      - APP_KEY=base64:XFevaluaciones2026SecretKeyPlaceholder=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=evaluaciones_db
      - DB_USERNAME=eval_user
      - DB_PASSWORD=eval_secret
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - eval-network
    depends_on:
      - db
      - redis

  # Nginx Web Server for Backend API
  web:
    image: nginx:1.25-alpine
    container_name: evaluaciones-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./evaluaciones-backend:/var/www/html
      - ./docker/backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eval-network
    depends_on:
      - app

  # Laravel Queue Worker for Async Exam Package Generation
  queue:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: evaluaciones-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=300
    volumes:
      - ./evaluaciones-backend:/var/www/html
    environment:
      - APP_NAME=EvaluacionesSISA
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=evaluaciones_db
      - DB_USERNAME=eval_user
      - DB_PASSWORD=eval_secret
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - eval-network
    depends_on:
      - app
      - redis

  # Frontend Quasar Application
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    container_name: evaluaciones-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./evaluaciones-frontend:/app
      - /app/node_modules
    networks:
      - eval-network

  # Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: evaluaciones-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evaluaciones_db
      POSTGRES_USER: eval_user
      POSTGRES_PASSWORD: eval_secret
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eval-network

  # Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: evaluaciones-redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    networks:
      - eval-network

networks:
  eval-network:
    driver: bridge

volumes:
  pgdata:
