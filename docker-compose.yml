version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Base de Datos PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: evaluaciones-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sea_evaluaciones}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./evaluaciones-backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - eval-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sea_evaluaciones}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ - Broker de colas para workers Python
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: evaluaciones-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    networks:
      - eval-network

  # ---------------------------------------------------------------------------
  # Backend Spring Boot
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./evaluaciones-backend
      dockerfile: Dockerfile
    container_name: evaluaciones-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sea_evaluaciones}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      UNITEPC_GATEWAY_BASE_URL: ${UNITEPC_GATEWAY_BASE_URL}
      UNITEPC_CLIENT_ID: ${UNITEPC_CLIENT_ID}
      UNITEPC_CLIENT_SECRET: ${UNITEPC_CLIENT_SECRET}
      UNITEPC_SYSTEM_CLIENT_ID: ${UNITEPC_SYSTEM_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_BASE_PATH: /app/storage
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
    networks:
      - eval-network

  # ---------------------------------------------------------------------------
  # Frontend Angular (servido por Nginx con build de producción)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./evaluaciones-frontend
      dockerfile: Dockerfile
    container_name: evaluaciones-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - eval-network

  # ---------------------------------------------------------------------------
  # Worker Python - Generación Typst
  # ---------------------------------------------------------------------------
  worker-typst:
    build:
      context: ./evaluaciones-workers
      dockerfile: Dockerfile.typst
    container_name: evaluaciones-worker-typst
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - backend
      - db
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sea_evaluaciones}
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      STORAGE_BASE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
      - ./bases:/app/bases:ro
      - ./evaluaciones-workers/main.py:/app/main.py:ro
      - ./evaluaciones-workers/src:/app/src:ro
    networks:
      - eval-network

  # ---------------------------------------------------------------------------
  # Worker Python - Procesamiento OMR (Fase 5)
  # ---------------------------------------------------------------------------
  worker-omr:
    build:
      context: ./evaluaciones-workers
      dockerfile: Dockerfile.omr
    container_name: evaluaciones-worker-omr
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - backend
      - db
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_QUEUE_IN: evaluaciones.omr.procesar
      RABBITMQ_QUEUE_OUT: evaluaciones.omr.resultado
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sea_evaluaciones}
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      STORAGE_BASE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
      - ./bases:/app/bases:ro
      - ./evaluaciones-workers/main_omr.py:/app/main_omr.py:ro
      - ./evaluaciones-workers/src:/app/src:ro
    networks:
      - eval-network

networks:
  eval-network:
    driver: bridge

volumes:
  pgdata:
