services:
  # ---------------------------------------------------------------------------
  # Base de Datos PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: evaluaciones-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sea_evaluaciones}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./evaluaciones-backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - eval-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sea_evaluaciones}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ - Broker de colas para workers Python
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: evaluaciones-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    networks:
      - eval-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Vault Transit - KMS provisional en el mismo servidor
  # Se ejecuta en modo servidor con almacenamiento persistente. La inicialización
  # inicial continúa siendo manual; vault-bootstrap automatiza el desbloqueo
  # posterior usando llaves montadas como secreto local.
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: evaluaciones-vault
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    volumes:
      - vaultdata:/vault/data
      - ./vault/config.hcl:/vault/config/vault.hcl:ro
      - ./vault/policies:/vault/policies:ro
    networks:
      - eval-network

  # Desbloqueo automático de Vault después de un reinicio o contingencia.
  # No inicializa ni recrea Vault: si faltan las llaves, permanece no saludable
  # y evita que backend/workers operen sin cifrado disponible.
  vault-bootstrap:
    image: hashicorp/vault:1.17
    container_name: evaluaciones-vault-bootstrap
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KEYS_FILE: /vault/secrets/unseal-keys
    volumes:
      - ./vault/bootstrap.sh:/vault/bootstrap.sh:ro
      - ./vault/secrets:/vault/secrets:ro
    command: ["sh", "/vault/bootstrap.sh"]
    networks:
      - eval-network
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://vault:8200 vault status -format=json 2>/dev/null | grep -q '\"sealed\"[[:space:]]*:[[:space:]]*false'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Backend Spring Boot
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./evaluaciones-backend
      dockerfile: Dockerfile
    container_name: evaluaciones-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault-bootstrap:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sea_evaluaciones}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      UNITEPC_GATEWAY_BASE_URL: ${UNITEPC_GATEWAY_BASE_URL}
      UNITEPC_CLIENT_ID: ${UNITEPC_CLIENT_ID}
      UNITEPC_CLIENT_SECRET: ${UNITEPC_CLIENT_SECRET}
      UNITEPC_SYSTEM_CLIENT_ID: ${UNITEPC_SYSTEM_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_BACKEND_TOKEN}
      VAULT_TRANSIT_KEY_NAME: ${VAULT_TRANSIT_KEY_NAME:-sea-banco-kek}
      KMS_MIGRATION_ENABLED: ${KMS_MIGRATION_ENABLED:-false}
      KMS_ROTATION_ENABLED: ${KMS_ROTATION_ENABLED:-false}
      STORAGE_BASE_PATH: /app/storage
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
    networks:
      - eval-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend Angular (servido por Nginx con build de producción)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./evaluaciones-frontend
      dockerfile: Dockerfile
    container_name: evaluaciones-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - eval-network

  # ---------------------------------------------------------------------------
  # Worker Python - Generación Typst
  # ---------------------------------------------------------------------------
  worker-typst:
    build:
      context: ./evaluaciones-workers
      dockerfile: Dockerfile.typst
    container_name: evaluaciones-worker-typst
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      vault-bootstrap:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sea_evaluaciones}
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      STORAGE_BASE_PATH: /app/storage
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_WORKER_TOKEN}
      VAULT_TRANSIT_KEY_NAME: ${VAULT_TRANSIT_KEY_NAME:-sea-banco-kek}
    volumes:
      - ./storage:/app/storage
      - ./bases:/app/bases:ro
      - ./evaluaciones-workers/main.py:/app/main.py:ro
      - ./evaluaciones-workers/src:/app/src:ro
    networks:
      - eval-network

  # ---------------------------------------------------------------------------
  # Worker Python - Procesamiento OMR (Fase 5)
  # ---------------------------------------------------------------------------
  worker-omr:
    build:
      context: ./evaluaciones-workers
      dockerfile: Dockerfile.omr
    container_name: evaluaciones-worker-omr
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      vault-bootstrap:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_QUEUE_IN: evaluaciones.omr.procesar
      RABBITMQ_QUEUE_OUT: evaluaciones.omr.resultado
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sea_evaluaciones}
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      STORAGE_BASE_PATH: /app/storage
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_OMR_TOKEN}
      VAULT_TRANSIT_KEY_NAME: ${VAULT_TRANSIT_KEY_NAME:-sea-banco-kek}
    volumes:
      - ./storage:/app/storage
      - ./bases:/app/bases:ro
      - ./evaluaciones-workers/main_omr.py:/app/main_omr.py:ro
      - ./evaluaciones-workers/src:/app/src:ro
    networks:
      - eval-network

networks:
  eval-network:
    driver: bridge

volumes:
  pgdata:
  vaultdata:
